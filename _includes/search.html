{%- comment -%}
  Sidebar search box. The index is a static file generated by
  tools/build-search-index.js and filtered in the browser by assets/js/search.js,
  because GitHub Pages (build_type: legacy) cannot run a search plugin.
{%- endcomment -%}
<div class="wiki-search" id="wikiSearch">
  <input class="ipTextInput wiki-search-input" id="wikiSearchInput" type="search"
         placeholder="Search" autocomplete="off" spellcheck="false"
         aria-label="Search the wiki"
         aria-controls="wikiSearchResults" aria-expanded="false" />
  <ul class="wiki-search-results" id="wikiSearchResults" role="listbox" hidden></ul>
</div>
