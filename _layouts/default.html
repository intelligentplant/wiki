<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}" />

  <link rel="stylesheet" href="{{ '/assets/ui-library/index.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/ui-overrides.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/wiki.css' | relative_url }}" />

  <!-- Theme selection (UI Library guide §3.2). Runs before the body paints so
       the page never renders in the wrong theme. -->
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</head>
<body class="wiki-body">
  <div class="wiki-shell">

    <header class="wiki-toolbar flex-row-sides">
      <div class="flex-row items-centre">
        <a class="flex-row items-centre" href="{{ '/index.html' | relative_url }}" title="Industrial App Store Wiki home">
          <img class="wiki-logo" src="{{ '/assets/ui-library/ip-logo.png' | relative_url }}" alt="Intelligent Plant" />
        </a>
      </div>
      <div class="flex-row items-centre gap-10">
        <span class="wiki-app-name">Industrial App Store Wiki</span>
        <!-- Theme menu: library dropDownMenu (guide §3.3 / §4.7). The selected
             theme is marked in --successColour with the colour-success helper. -->
        <div class="dropDownMenu wrapper" id="ipThemeMenu">
          <div class="dropDownMenu header clickable font-size-small" id="ipThemeTrigger"
               role="button" tabindex="0" aria-haspopup="true" aria-expanded="false" title="Theme">
            <span id="ipThemeLabel">Theme</span>
            <span class="icon-ip-drop-down-arrow-filled margin-left-6" aria-hidden="true"></span>
          </div>
          <div class="dropDownMenu menuContainer" id="ipThemeList" hidden>
            <div class="padding-1 margin-bottom-10">Theme</div>
            <a class="clickable" href="#" data-theme="system default">System Default</a>
            <a class="clickable" href="#" data-theme="whiteTheme">Light</a>
            <a class="clickable" href="#" data-theme="darkTheme">Dark</a>
            <a class="clickable" href="#" data-theme="blueTheme">Blue</a>
          </div>
        </div>
      </div>
    </header>

    <div class="wiki-main flex-row grow-1">
      <!-- Contents toggle. Like Gestalt's #trigger it lives outside the panel it
           controls (component.css `.menu-trigger`, before `<nav id="mp-menu">`)
           so it stays visible when the panel is hidden. -->
      <button class="wiki-nav-toggle icon-ip-Burger" id="wikiNavToggle"
              type="button" title="Toggle contents"
              aria-controls="wikiNav" aria-expanded="true"></button>
      <aside class="wiki-sidebar scrollbar" id="wikiNav" aria-label="Wiki contents">
        {% include search.html %}
        {% include nav.html %}
      </aside>

      <main class="wiki-content scrollbar grow-1" id="main-content">
        {{ content }}
      </main>
    </div>
  </div>

  <script src="{{ '/assets/js/wiki.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/search.js' | relative_url }}"></script>
</body>
</html>
